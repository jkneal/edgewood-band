<style>
  * { box-sizing: border-box; }

  /* Offset anchor scrolling so the sticky header doesn't clip section headings */
  #news, #calendars { scroll-margin-top: 92px; }

  @keyframes emShine { 0% { background-position: -140% 0; } 100% { background-position: 240% 0; } }
  @keyframes emMarquee { 0% { transform: translateX(0); } 100% { transform: translateX(-50%); } }
  @keyframes emRise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }

  /* The show-history marquee scrolls continuously; honour a reduced-motion preference */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: .01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: .01ms !important;
      scroll-behavior: auto !important;
    }
  }

  /* Nav links */
  .navlink { padding:11px 15px; border-radius:4px; font-weight:600; font-size:14.5px; cursor:pointer; transition:background .14s ease; color:#fff; }
  .navlink:hover { background:rgba(255,255,255,.10); }
  .navlink.active { background:rgba(255,255,255,.16); }

  /* Mobile menu: hamburger hidden on desktop, shown + desktop nav hidden under 840px */
  .desktop-nav { display:flex; align-items:center; gap:4px; flex-wrap:wrap; }
  .wordmark-desktop { display:inline; }
  .wordmark-mobile { display:none; }
  .nav-toggle { display:none; flex-direction:column; justify-content:center; gap:5px; flex:none; width:44px; height:44px; padding:0; background:none; border:none; cursor:pointer; }
  .nav-toggle .bar { display:block; width:22px; height:2px; margin:0 auto; background:#fff; border-radius:1px; transition:transform .16s ease, opacity .16s ease; }
  .nav-toggle.open .bar:nth-child(1) { transform:translateY(7px) rotate(45deg); }
  .nav-toggle.open .bar:nth-child(2) { opacity:0; }
  .nav-toggle.open .bar:nth-child(3) { transform:translateY(-7px) rotate(-45deg); }
  .mobile-nav { display:none; flex-direction:column; gap:2px; padding:6px 28px 20px; border-top:1px solid rgba(255,255,255,.15); }
  .mobile-nav.open { display:flex; }
  .mobile-nav .navlink { padding:13px 6px; text-align:left; }
  @media (max-width: 840px) {
    .desktop-nav { display:none; }
    .nav-toggle { display:flex; }
    .wordmark-desktop { display:none; }
    .wordmark-mobile { display:inline; }
  }

  /* Hover interactions (ported from design style-hover attrs) */
  .btn-red:hover { transform:translateY(2px); box-shadow:0 4px 0 #5C0A11; }
  .btn-student { box-shadow:0 4px 0 #E2B9BC; transition:transform .12s ease, box-shadow .12s ease; }
  .btn-student:hover { transform:translateY(2px); box-shadow:0 2px 0 #E2B9BC; }
  .card-featured:hover { transform:translateY(-4px); box-shadow:0 24px 50px rgba(120,15,25,.2); }
  .card-news:hover { transform:translateX(4px); }
  .cal-tile:hover { background:rgba(255,255,255,.12); border-color:rgba(255,255,255,.45); }
  .card-momma:hover { transform:translateY(-4px); }
  .row-resource:hover { background:#FCF0F1; }
  .contact-line { color:#A31621; }
  .contact-line:hover { text-decoration:underline; }
  .foot-link:hover { color:#ffffff; }

  /* Layout grids (responsive) */
  .g-stats { display:grid; grid-template-columns:repeat(3,1fr); gap:12px; text-align:center; }
  .stat-num { font-size:clamp(34px,4vw,50px); }
  @media (max-width: 400px) { .stat-num { font-size:26px; } }
  .g-news { display:grid; grid-template-columns:1.15fr .85fr; gap:26px; }
  .g-cal { display:grid; grid-template-columns:.8fr 1.2fr; gap:56px; align-items:start; }
  .g-cal-tiles { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .g-forms { display:grid; grid-template-columns:1fr auto; gap:40px; align-items:center; }
  .g-momma { display:grid; grid-template-columns:repeat(3,1fr); gap:16px; }
  .g-people { display:grid; grid-template-columns:repeat(3,1fr); gap:16px; }
  .g-ann { display:grid; grid-template-columns:1fr 1.2fr; }
  .hero-ribbon { z-index:0; box-sizing:border-box; }

  /* Footer */
  .foot-row { display:flex; align-items:center; justify-content:space-between; gap:24px 36px; flex-wrap:wrap; }
  .foot-brand { display:flex; align-items:center; gap:28px; flex-wrap:wrap; }
  .foot-partners { display:flex; align-items:center; gap:20px; font-size:13.5px; flex-wrap:wrap; }

  @media (max-width: 960px) {
    .g-momma, .g-people { grid-template-columns:repeat(2,1fr); }
  }
  @media (max-width: 840px) {
    .g-news { grid-template-columns:1fr; }
    .g-cal { grid-template-columns:1fr; gap:34px; }
    .g-forms { grid-template-columns:1fr; gap:26px; }
    .g-ann { grid-template-columns:1fr; }
    .foot-partners { display:none; }
  }
  @media (max-width: 560px) {
    .hero-ribbon { display:none; }
    .g-cal-tiles { grid-template-columns:1fr; }
    .g-momma, .g-people { grid-template-columns:1fr; }
  }
</style>

            '<a class="contact-line" href="mailto:ehsperformingarts@gmail.com" style="display:inline-block; font-family:\'Source Serif 4\', serif; font-size:22px; margin-top:8px; color:#16181D;">ehsperformingarts@gmail.com</a>' +
          '</div>' +
          '<a href="https://www.facebook.com/groups/398146963576638/" target="_blank" rel="noopener" class="btn-red" style="flex:none; background:#A31621; color:#fff; font-weight:700; padding:12px 22px; border-radius:5px; font-size:14.5px;">Facebook group</a>' +
        '</div>' +
      '</section>' +

      // DIRECTORS
      '<section style="max-width:1060px; margin:0 auto; padding:40px 28px 0;">' +
        '<h2 style="font-family:\'Anton\'; font-weight:400; font-size:clamp(26px,3.2vw,36px); text-transform:uppercase; margin:0 0 20px; color:#16181D;">Directors</h2>' +
        '<div class="g-people">' + directors.map(card).join('') + '</div>' +
      '</section>' +

      // BOOSTER BOARD
      '<section style="max-width:1060px; margin:0 auto; padding:40px 28px 80px;">' +
        '<div style="display:flex; align-items:baseline; gap:14px; flex-wrap:wrap; margin-bottom:20px;">' +
          '<h2 style="font-family:\'Anton\'; font-weight:400; font-size:clamp(26px,3.2vw,36px); text-transform:uppercase; margin:0; color:#16181D;">Booster board</h2>' +
          '<span style="font-size:12.5px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:#646B76;">' + esc(rosterYear) + '</span>' +
        '</div>' +
        '<div class="g-people">' + boosters.map(card).join('') + '</div>' +
      '</section>' +
    '</div>';
  }

  var EPA = {
    state: { page: 'home' },
    go: function (page) {
      this.state.page = page;
      this.render();
      this.closeMenu();
      window.scrollTo(0, 0);
      return false;
    },
    goSection: function (id) {
      // render() swaps innerHTML synchronously, so the target exists immediately after.
      if (this.state.page !== 'home') {
        this.state.page = 'home';
        this.render();
      }
      this.closeMenu();
      var el = document.getElementById(id);
      if (el) el.scrollIntoView({ behavior: 'smooth' });
      return false;
    },
    toggleMenu: function () {
      var nav = document.getElementById('mobile-nav');
      var btn = document.getElementById('nav-toggle');
      var open = nav.classList.toggle('open');
      btn.classList.toggle('open', open);
      btn.setAttribute('aria-expanded', open ? 'true' : 'false');
      return false;
    },
    closeMenu: function () {
      document.getElementById('mobile-nav').classList.remove('open');
      var btn = document.getElementById('nav-toggle');
      btn.classList.remove('open');
      btn.setAttribute('aria-expanded', 'false');
    },
    render: function () {
      var view = document.getElementById('view');
      var page = this.state.page;
      if (page === 'announcements') view.innerHTML = renderAnnouncements();
      else if (page === 'forms') view.innerHTML = renderForms();
      else if (page === 'contacts') view.innerHTML = renderContacts();
      else view.innerHTML = renderHome();

      var links = document.querySelectorAll('[data-page]');
      for (var i = 0; i < links.length; i++) {
        links[i].classList.toggle('active', links[i].getAttribute('data-page') === page);
      }
    }
  };

  window.EPA = EPA;
  EPA.render();
})();
</script>
</body>
</html>
